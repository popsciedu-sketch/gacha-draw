<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>扭蛋抽籤機</title>
<style>
  :root {
    --bg0: #0b1020;
    --bg1: #161b33;
    --pink: #ff4d8d;
    --cyan: #3de7ff;
    --gold: #ffd166;
    --purple: #9b5cff;
    --glass: rgba(255,255,255,0.12);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    font-family: "Segoe UI", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, #2a1a4a 0%, var(--bg0) 55%);
    color: #fff;
    overflow: hidden;
  }
  body {
    display: grid;
    grid-template-rows: auto 1fr auto;
    min-height: 100dvh;
    padding: 0.6rem 0.75rem calc(0.6rem + var(--safe-b));
    gap: 0.5rem;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
    flex-wrap: wrap;
  }
  h1 {
    margin: 0; font-size: clamp(1.05rem, 3.5vw, 1.45rem); letter-spacing: 0.04em;
    background: linear-gradient(90deg, var(--gold), #fff, var(--cyan));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .meta {
    font-size: 0.78rem; opacity: 0.85;
    display: flex; gap: 0.6rem; flex-wrap: wrap;
  }
  .meta b { color: var(--gold); }

  .stage {
    position: relative;
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: 0.75rem;
    min-height: 0;
    height: 100%;
  }
  @media (max-width: 820px) {
    .stage { grid-template-columns: 1fr; grid-template-rows: minmax(280px, 52dvh) minmax(0, 1fr); }
  }

  .machine-wrap {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    min-height: 0;
  }
  .machine {
    position: relative;
    width: min(100%, 360px);
    aspect-ratio: 3 / 4.2;
    max-height: 100%;
    filter: drop-shadow(0 18px 40px rgba(0,0,0,0.45));
  }
  .dome {
    position: absolute; left: 10%; right: 10%; top: 2%; height: 58%;
    border-radius: 50% 50% 46% 46% / 58% 58% 42% 42%;
    background:
      radial-gradient(circle at 35% 25%, rgba(255,255,255,0.35), transparent 40%),
      linear-gradient(180deg, rgba(180,220,255,0.22), rgba(80,100,160,0.08));
    border: 3px solid rgba(255,255,255,0.35);
    overflow: hidden;
    box-shadow: inset 0 -20px 40px rgba(0,0,0,0.25);
  }
  .dome.shake { animation: shake 0.55s ease-in-out; }
  .dome.spinning .egg { animation-duration: 0.35s !important; }
  @keyframes shake {
    0%,100% { transform: translateX(0) rotate(0); }
    20% { transform: translateX(-6px) rotate(-1.5deg); }
    40% { transform: translateX(7px) rotate(1.5deg); }
    60% { transform: translateX(-5px) rotate(-1deg); }
    80% { transform: translateX(4px) rotate(0.8deg); }
  }
  .eggs {
    position: absolute; inset: 8% 6% 10%;
    display: flex; flex-wrap: wrap; align-content: flex-end; justify-content: center;
    gap: 4px; perspective: 400px;
  }
  .egg {
    width: clamp(18px, 5.2vw, 28px);
    height: clamp(22px, 6.2vw, 34px);
    border-radius: 50% 50% 48% 48% / 58% 58% 42% 42%;
    position: relative;
    box-shadow: inset -3px -4px 6px rgba(0,0,0,0.25), 0 2px 4px rgba(0,0,0,0.3);
    animation: bob 2.4s ease-in-out infinite;
    transform-origin: center bottom;
    flex: 0 0 auto;
  }
  .egg::after {
    content: ""; position: absolute; left: 22%; top: 18%;
    width: 28%; height: 22%; border-radius: 50%;
    background: rgba(255,255,255,0.55);
  }
  .egg.voiding {
    animation: voidEgg 0.7s ease-in forwards;
  }
  @keyframes bob {
    0%,100% { transform: translateY(0) rotate(-4deg); }
    50% { transform: translateY(-4px) rotate(5deg); }
  }
  @keyframes voidEgg {
    0% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(0.2) translateY(20px); }
  }
  .body {
    position: absolute; left: 6%; right: 6%; top: 52%; bottom: 0;
    background: linear-gradient(180deg, #ff6b9d 0%, #c41e6a 45%, #8b1048 100%);
    border-radius: 18px 18px 28px 28px;
    border: 3px solid rgba(255,255,255,0.25);
    box-shadow: inset 0 8px 20px rgba(255,255,255,0.15);
  }
  .slot {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: 12%; width: 42%; height: 14%;
    background: #1a1020;
    border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.2);
    box-shadow: inset 0 6px 14px rgba(0,0,0,0.7);
    overflow: hidden;
  }
  .slot-label {
    position: absolute; left: 0; right: 0; top: 30%;
    text-align: center; font-size: 0.65rem; opacity: 0.5; letter-spacing: 0.12em;
  }
  .knob {
    position: absolute; right: 10%; top: 38%;
    width: 18%; aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff6a8, #f0b429 50%, #a86b00 100%);
    border: 3px solid rgba(255,255,255,0.35);
    box-shadow: 0 4px 0 #7a4a00, 0 8px 16px rgba(0,0,0,0.35);
    cursor: pointer;
    transition: transform 0.1s;
  }
  .knob:active { transform: scale(0.92) translateY(2px); box-shadow: 0 1px 0 #7a4a00; }
  .knob.spin { animation: knobSpin 0.9s cubic-bezier(.2,.8,.2,1); }
  @keyframes knobSpin {
    0% { transform: rotate(0); }
    100% { transform: rotate(720deg); }
  }
  .panel {
    position: absolute; left: 10%; right: 10%; bottom: 10%;
    height: 28%;
    background: rgba(0,0,0,0.25);
    border-radius: 14px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.35rem; padding: 0.4rem;
  }
  .draw-btn {
    appearance: none; border: 0; cursor: pointer;
    width: 88%; padding: 0.7rem 0.5rem;
    border-radius: 999px;
    font-weight: 800; font-size: clamp(0.95rem, 3.5vw, 1.1rem);
    color: #2a1040;
    background: linear-gradient(180deg, #fff3b0, var(--gold) 55%, #e0a100);
    box-shadow: 0 6px 0 #9a6a00, 0 10px 24px rgba(0,0,0,0.35);
    transition: transform 0.12s, filter 0.12s;
  }
  .draw-btn:disabled {
    filter: grayscale(0.6) brightness(0.7); cursor: not-allowed;
    box-shadow: none;
  }
  .draw-btn:not(:disabled):active { transform: translateY(3px); box-shadow: 0 2px 0 #9a6a00; }
  .sub {
    font-size: 0.7rem; opacity: 0.8;
  }

  .side {
    display: flex; flex-direction: column; gap: 0.55rem; min-height: 0;
  }
  .card {
    background: var(--glass);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 16px;
    padding: 0.7rem 0.8rem;
    min-height: 0;
  }
  .card h2 {
    margin: 0 0 0.45rem; font-size: 0.85rem; letter-spacing: 0.06em;
    color: var(--cyan); font-weight: 700; text-transform: uppercase;
  }
  .winners {
    flex: 1.1; display: flex; flex-direction: column; min-height: 0;
  }
  .winner-list {
    list-style: none; margin: 0; padding: 0;
    display: flex; flex-direction: column; gap: 0.4rem;
    overflow: auto; flex: 1;
  }
  .winner-list li {
    display: flex; align-items: center; gap: 0.55rem;
    padding: 0.55rem 0.65rem;
    border-radius: 12px;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.08);
    animation: popIn 0.55s cubic-bezier(.2,1.4,.3,1) both;
  }
  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.6) translateY(12px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  .badge {
    width: 1.7rem; height: 1.7rem; border-radius: 50%;
    display: grid; place-items: center;
    font-weight: 800; font-size: 0.8rem; color: #2a1040;
    background: linear-gradient(135deg, var(--gold), #fff);
    flex: 0 0 auto;
  }
  .winner-name { font-weight: 700; font-size: 1rem; }
  .winner-note { margin-left: auto; font-size: 0.72rem; opacity: 0.7; }

  .pool {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
  }
  .chips {
    display: flex; flex-wrap: wrap; gap: 0.35rem;
    overflow: auto; flex: 1; align-content: flex-start;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 0.3rem;
    padding: 0.28rem 0.5rem;
    border-radius: 999px;
    font-size: 0.75rem;
    background: rgba(0,0,0,0.28);
    border: 1px solid rgba(255,255,255,0.1);
    transition: opacity 0.4s, filter 0.4s, transform 0.4s;
  }
  .chip .n {
    min-width: 1.1rem; height: 1.1rem; border-radius: 50%;
    display: grid; place-items: center;
    font-weight: 800; font-size: 0.68rem; color: #1a1020;
    background: var(--cyan);
  }
  .chip.out {
    opacity: 0.28; filter: grayscale(1); text-decoration: line-through;
    transform: scale(0.95);
  }

  .popup {
    position: absolute; inset: 0; pointer-events: none;
    display: grid; place-items: center; z-index: 5;
  }
  .pop-egg {
    width: min(46vw, 160px); aspect-ratio: 5/6;
    border-radius: 50% 50% 48% 48% / 58% 58% 42% 42%;
    display: grid; place-items: center;
    font-weight: 900; font-size: clamp(1rem, 4.5vw, 1.35rem);
    text-align: center; padding: 0.5rem;
    color: #1a1020;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset -6px -8px 16px rgba(0,0,0,0.2);
    opacity: 0; transform: translateY(40px) scale(0.4);
  }
  .pop-egg.show {
    animation: eggOut 1.35s cubic-bezier(.15,1.2,.3,1) forwards;
  }
  @keyframes eggOut {
    0% { opacity: 0; transform: translateY(80px) scale(0.3) rotate(-20deg); }
    35% { opacity: 1; transform: translateY(-30px) scale(1.15) rotate(8deg); }
    60% { transform: translateY(0) scale(1) rotate(-3deg); }
    100% { opacity: 1; transform: translateY(-8px) scale(1.05) rotate(0); }
  }
  .crack {
    position: absolute; inset: 0; border-radius: inherit;
    background: linear-gradient(135deg, transparent 45%, rgba(255,255,255,0.5) 50%, transparent 55%);
    opacity: 0;
  }
  .pop-egg.crack .crack { animation: flash 0.4s ease 0.55s both; }
  @keyframes flash { 0%{opacity:0} 40%{opacity:1} 100%{opacity:0} }

  canvas#fx {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 20;
  }

  footer {
    display: flex; gap: 0.5rem; justify-content: space-between; align-items: center;
    flex-wrap: wrap; font-size: 0.72rem; opacity: 0.75;
  }
  .ghost {
    appearance: none; border: 1px solid rgba(255,255,255,0.25);
    background: transparent; color: #fff; border-radius: 999px;
    padding: 0.4rem 0.85rem; cursor: pointer; font-size: 0.78rem;
  }
  .ghost:hover { background: rgba(255,255,255,0.08); }

  .toast {
    position: fixed; left: 50%; bottom: calc(1.2rem + var(--safe-b));
    transform: translateX(-50%) translateY(20px);
    background: rgba(20,16,40,0.92); border: 1px solid rgba(255,255,255,0.2);
    padding: 0.55rem 1rem; border-radius: 999px; font-size: 0.85rem;
    opacity: 0; pointer-events: none; z-index: 30; transition: .3s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <header>
    <h1>🎰 扭蛋抽籤機</h1>
    <div class="meta">
      <span>剩餘票 <b id="ticketCount">0</b></span>
      <span>已抽 <b id="drawnCount">0</b> / 5</span>
    </div>
  </header>

  <main class="stage">
    <div class="machine-wrap">
      <div class="machine" id="machine">
        <div class="dome" id="dome">
          <div class="eggs" id="eggs"></div>
        </div>
        <div class="body">
          <div class="slot">
            <div class="slot-label">出口</div>
          </div>
          <button class="knob" id="knob" title="轉扭蛋" aria-label="轉扭蛋"></button>
          <div class="panel">
            <button class="draw-btn" id="drawBtn">扭一顆！</button>
            <div class="sub" id="hint">同一人只可中一次 · 中獎後剩餘票即時作廢</div>
          </div>
        </div>
      </div>
      <div class="popup" aria-live="polite">
        <div class="pop-egg" id="popEgg"><span class="crack"></span><span id="popName"></span></div>
      </div>
    </div>

    <aside class="side">
      <section class="card winners">
        <h2>中獎名單</h2>
        <ol class="winner-list" id="winners"></ol>
      </section>
      <section class="card pool">
        <h2>票池</h2>
        <div class="chips" id="chips"></div>
      </section>
    </aside>
  </main>

  <footer>
    <span>共抽出 5 人 · 權重 = 票數</span>
    <button class="ghost" id="resetBtn" type="button">重新開始</button>
  </footer>
  <div class="toast" id="toast"></div>
  <canvas id="fx"></canvas>

<script>
const ENTRIES = [
  ["Labubu", 5], ["Sam", 5], ["Nicole", 3], ["木木", 2], ["Ryan", 3],
  ["Silvia", 2], ["Yan", 2], ["Barry", 2], ["George", 1], ["Candy", 1],
  ["Ramsey", 1], ["Jane", 1], ["Thomas", 1], ["Fong", 1], ["Carlos", 1],
  ["Matthew", 2], ["Oscar", 2],
];
const MAX_WIN = 5;
const COLORS = [
  "#ff6b9d","#3de7ff","#ffd166","#9b5cff","#7CFFB2",
  "#FF8A5B","#6EC1FF","#F72585","#B8F2E6","#FFBE0B",
  "#FB5607","#8338EC","#06D6A0","#EF476F","#118AB2",
  "#FFD6FF","#90DBF4"
];

let tickets = []; // {name, color}
let remaining = new Map(); // name -> count
let winners = [];
let busy = false;
let audioCtx = null;

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._tm);
  toast._tm = setTimeout(() => t.classList.remove("show"), 2200);
}

function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
}

function beep(freq, dur, type="sine", gain=0.08, when=0) {
  ensureAudio();
  const t0 = audioCtx.currentTime + when;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}

function sfxShake() {
  for (let i = 0; i < 10; i++) {
    beep(120 + Math.random()*80, 0.04, "triangle", 0.05, i * 0.045);
  }
}
function sfxPop() {
  beep(520, 0.12, "square", 0.07);
  beep(780, 0.18, "sine", 0.06, 0.08);
  beep(1040, 0.25, "sine", 0.05, 0.16);
}
function sfxWin() {
  const notes = [523, 659, 784, 1046];
  notes.forEach((n, i) => beep(n, 0.22, "sine", 0.07, i * 0.1));
}
function sfxDone() {
  [392, 494, 587, 784, 988].forEach((n, i) => beep(n, 0.28, "triangle", 0.06, i * 0.12));
}

function rebuildPool() {
  tickets = [];
  remaining = new Map();
  ENTRIES.forEach(([name, n], i) => {
    remaining.set(name, n);
    const color = COLORS[i % COLORS.length];
    for (let k = 0; k < n; k++) tickets.push({ name, color });
  });
  // shuffle
  for (let i = tickets.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [tickets[i], tickets[j]] = [tickets[j], tickets[i]];
  }
  winners = [];
  busy = false;
  renderEggs();
  renderChips();
  renderWinners();
  updateMeta();
  document.getElementById("drawBtn").disabled = false;
  document.getElementById("hint").textContent = "同一人只可中一次 · 中獎後剩餘票即時作廢";
  const pop = document.getElementById("popEgg");
  pop.classList.remove("show", "crack");
}

function renderEggs() {
  const box = document.getElementById("eggs");
  box.innerHTML = "";
  // Cap visual eggs for performance but keep ratio feel
  const maxVis = Math.min(tickets.length, 48);
  const sample = tickets.slice(0, maxVis);
  sample.forEach((t, i) => {
    const e = document.createElement("div");
    e.className = "egg";
    e.style.background = `radial-gradient(circle at 30% 28%, #fff8, transparent 40%), ${t.color}`;
    e.style.animationDelay = `${(i % 7) * 0.12}s`;
    e.dataset.name = t.name;
    box.appendChild(e);
  });
}

function renderChips() {
  const box = document.getElementById("chips");
  box.innerHTML = "";
  ENTRIES.forEach(([name], i) => {
    const n = remaining.get(name) ?? 0;
    const el = document.createElement("div");
    el.className = "chip" + (n === 0 && winners.includes(name) ? " out" : n === 0 ? " out" : "");
    el.innerHTML = `<span class="n" style="background:${COLORS[i % COLORS.length]}">${n}</span>${name}`;
    box.appendChild(el);
  });
}

function renderWinners() {
  const list = document.getElementById("winners");
  list.innerHTML = "";
  winners.forEach((name, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<span class="badge">${i + 1}</span><span class="winner-name">${name}</span><span class="winner-note">票數作廢</span>`;
    list.appendChild(li);
  });
  for (let i = winners.length; i < MAX_WIN; i++) {
    const li = document.createElement("li");
    li.style.opacity = "0.35";
    li.innerHTML = `<span class="badge">${i + 1}</span><span class="winner-name">等待扭出…</span>`;
    list.appendChild(li);
  }
}

function updateMeta() {
  document.getElementById("ticketCount").textContent = tickets.length;
  document.getElementById("drawnCount").textContent = winners.length;
}

function confettiBurst(color) {
  const c = document.getElementById("fx");
  const ctx = c.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const parts = Array.from({ length: 90 }, () => ({
    x: innerWidth / 2 + (Math.random() - 0.5) * 80,
    y: innerHeight * 0.38,
    vx: (Math.random() - 0.5) * 14,
    vy: -Math.random() * 12 - 4,
    g: 0.28 + Math.random() * 0.15,
    s: 4 + Math.random() * 6,
    rot: Math.random() * Math.PI,
    vr: (Math.random() - 0.5) * 0.4,
    color: Math.random() > 0.4 ? color : COLORS[Math.floor(Math.random() * COLORS.length)],
    life: 60 + Math.random() * 40,
  }));
  let frame = 0;
  function tick() {
    frame++;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    let alive = false;
    parts.forEach(p => {
      if (p.life <= 0) return;
      alive = true;
      p.life--;
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, p.life / 40);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
      ctx.restore();
    });
    if (alive) requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, innerWidth, innerHeight);
  }
  requestAnimationFrame(tick);
}

function pickWinner() {
  if (!tickets.length) return null;
  const idx = Math.floor(Math.random() * tickets.length);
  return tickets[idx].name;
}

function voidPerson(name) {
  tickets = tickets.filter(t => t.name !== name);
  remaining.set(name, 0);
}

async function drawOnce() {
  if (busy) return;
  if (winners.length >= MAX_WIN) {
    toast("已經抽齊 5 人啦");
    return;
  }
  if (!tickets.length) {
    toast("票池已空");
    return;
  }
  busy = true;
  ensureAudio();
  const btn = document.getElementById("drawBtn");
  btn.disabled = true;
  const dome = document.getElementById("dome");
  const knob = document.getElementById("knob");
  const pop = document.getElementById("popEgg");
  const popName = document.getElementById("popName");

  pop.classList.remove("show", "crack");
  knob.classList.remove("spin");
  void knob.offsetWidth;
  knob.classList.add("spin");
  dome.classList.add("shake", "spinning");
  sfxShake();

  await wait(900);
  dome.classList.remove("shake");

  const name = pickWinner();
  const color = ENTRIES.find(e => e[0] === name)
    ? COLORS[ENTRIES.findIndex(e => e[0] === name) % COLORS.length]
    : "#ffd166";

  // void remaining tickets of winner
  voidPerson(name);
  winners.push(name);

  // visual void some eggs
  document.querySelectorAll(`.egg[data-name="${CSS.escape(name)}"]`).forEach(el => {
    el.classList.add("voiding");
  });
  setTimeout(() => renderEggs(), 700);

  pop.style.background = `radial-gradient(circle at 30% 28%, #fff8, transparent 42%), ${color}`;
  popName.textContent = name;
  pop.classList.add("show", "crack");
  sfxPop();
  setTimeout(() => { sfxWin(); confettiBurst(color); }, 500);

  renderChips();
  renderWinners();
  updateMeta();

  await wait(1600);
  dome.classList.remove("spinning");

  if (winners.length >= MAX_WIN) {
    btn.disabled = true;
    document.getElementById("hint").textContent = "抽籤完成 · 可按重新開始";
    sfxDone();
    toast("🎉 五位幸運兒已就位！");
  } else {
    btn.disabled = false;
    document.getElementById("hint").textContent = `再扭 ${MAX_WIN - winners.length} 次`;
  }
  busy = false;
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

document.getElementById("drawBtn").addEventListener("click", drawOnce);
document.getElementById("knob").addEventListener("click", drawOnce);
document.getElementById("resetBtn").addEventListener("click", () => {
  rebuildPool();
  toast("已重置票池");
  beep(440, 0.1, "sine", 0.05);
});

rebuildPool();
</script>
</body>
</html>
